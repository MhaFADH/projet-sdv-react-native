name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: "true"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install diff-cover==10.5.1

      - name: Check formatting and lint rules
        run: npm run check

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Enforce changed-line coverage
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD)
          fi
          diff-cover coverage/cobertura-coverage.xml \
            --compare-branch="$BASE_SHA" \
            --diff-range-notation=.. \
            --fail-under=70 \
            --show-uncovered

      - name: Check types
        run: npm run typecheck

      - name: Find unused code and dependencies
        run: npm run knip

      - name: Check Expo dependency versions
        run: npx expo install --check
